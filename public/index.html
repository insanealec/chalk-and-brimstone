<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>Chalk &amp; Brimstone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
  <script>
    // The live site sends every file with Cache-Control: no-cache (see _headers), so browsers reuse unchanged
    // files but never run a mix of old and new ones after an update. Local servers don't, so there every file
    // loads with a timestamp instead.
    const LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    const FRESH = LOCAL ? `?v=${Date.now()}` : '';
    document.write(`<link rel="stylesheet" href="css/style.css${FRESH}">`);
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="title">Chalk &amp; Brimstone</span>
      <button class="ghost tiny" data-action="new-game">New game</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="chamber" data-label="Chamber">Chamber</button>
    <button data-tab="city" data-label="City">City</button>
    <button data-tab="journal" data-label="Journal">Journal</button>
    <button data-tab="servants" data-label="Servants">Servants</button>
    <button data-tab="workshop" data-label="Workshop">Workshop</button>
    <button data-tab="market" data-label="Market">Market</button>
    <button data-tab="cityhall" data-label="City Hall">City Hall</button>
  </nav>

  <main>
    <section id="view"></section>
    <aside id="log" class="panel"></aside>
  </main>

  <!-- phones and narrow windows: hours, End day and the chronicle drawer, within thumb reach -->
  <nav class="bottombar" id="bottombar"></nav>
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-action="close-log"></div>
    <section class="drawer-sheet" role="dialog" aria-label="Chronicle">
      <header><h2>Chronicle</h2><button class="ghost" data-action="close-log">Close</button></header>
      <div class="drawer-body" id="drawer-log"></div>
    </section>
  </div>

  <div id="overlay" hidden></div>

  <script>
    // content first, then the engine, the interface, and main.js (which starts the game) last
    const SCRIPTS = ['js/data.js', 'js/districts.js', 'js/events.js', 'js/ithzar.js',
      'js/engine/core.js', 'js/engine/notebook.js', 'js/engine/spirits.js', 'js/engine/companion.js',
      'js/engine/chamber.js', 'js/engine/city.js', 'js/engine/day.js', 'js/ui/shell.js', 'js/ui/chamber.js', 'js/ui/city.js', 'js/main.js'];
    for (const src of SCRIPTS) {
      document.write(`<script src="${src}${FRESH}"><\/script>`);
    }
  </script>
</body>
</html>
